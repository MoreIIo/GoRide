# Fabrique l'installateur Windows et le publie dans une « Release » GitHub.
# Pour publier une version : pousser un tag, par ex.
#   git tag v0.1.0
#   git push origin v0.1.0
# Une release en brouillon apparaît ensuite dans l'onglet Releases : la relire, puis « Publish ».
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GoRide ${{ github.ref_name }}
          releaseBody: |
            Installateur Windows de GoRide.
            Télécharger le fichier `GoRide_..._x64-setup.exe` ci-dessous et le lancer.
            Windows peut afficher « Windows a protégé votre ordinateur » (application non signée) : « Informations complémentaires » → « Exécuter quand même ».
          releaseDraft: true
          prerelease: false
